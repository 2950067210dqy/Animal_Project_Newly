;监测数据的配置文件
[STORAGE]
;存储数据 在当前项目下的data文件夹下
fold_path = ./data/
;存储数据 在./data/monitor_data/ 文件夹下
sub_fold_path = /monitor_data/
;存储线程的delay 单位秒
delay = 0
;发送请求报文
[SEND]
;发送请求报文delay 单位秒
delay = 0
;已经弃用！发送请求报文之后获得响应报文的等待时间 单位秒
;变更为获得响应报文之后的等待时间 单位秒
get_response_delay =0
;串口配置
[Serial]
;timeout 单位秒
timeout = 0.05
;定时导出xlsx配置
[EXPORT]
;定时导出xlsx间隔，单位分钟；小于等于0表示关闭定时导出
periodic_xlsx_interval_minutes = 30
