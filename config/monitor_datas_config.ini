;监测数据的配置文件
[STORAGE]
;存储数据 在当前项目下的data文件夹下
fold_path = ./data/
;存储数据 在./data/monitor_data/ 文件夹下
sub_fold_path = /monitor_data/
;存储线程的delay 单位秒
delay = 0
;发送请求报文
[SEND]
;发送请求报文delay 单位秒
delay = 0.52
;已经弃用！发送请求报文之后获得响应报文的等待时间 单位秒
;变更为获得响应报文之后的等待时间 单位秒
get_response_delay =0
;串口配置
[Serial]
;timeout 单位秒
timeout = 0.05
;定时导出xlsx配置
[EXPORT]
;定时导出xlsx间隔，单位分钟；小于等于0表示关闭定时导出
periodic_xlsx_interval_minutes = 30
[WEIGHT_POSTPROCESS]
;停止实验导出原始Excel后，是否额外生成称重拟合Excel
enabled = true
;首次建立空秤基线及每次称重事件使用的有效数据点数
event_window_points = 15
;低位组、高位组及异常过滤后至少保留的数据点数
minimum_group_points = 5
;合理小鼠体重范围，单位g
minimum_body_weight_g = 5.0
maximum_body_weight_g = 80.0
;首次空秤基线与实验前人工体重的最大允许偏差：比例和最小值取较大者
initial_weight_match_ratio = 0.20
initial_weight_match_min_g = 2.0
;单次称重事件内过滤异常点的最大允许偏差：比例和最小值取较大者
event_outlier_ratio = 0.05
event_outlier_min_g = 1.0
;首次确认的称重事件与人工初始体重的最大允许偏差：比例和最小值取较大者
first_event_match_ratio = 0.05
first_event_match_min_g = 1.0
;首次确认后，每个时间周期内允许的体重自然增减范围
weight_change_period_hours = 24.0
weight_change_ratio_per_period = 0.05
;时间间隔很短或缺少时间时，仍允许的最小称量误差，单位g
weight_change_min_g = 1.0
;拟合结果保留小数位数
decimal_places = 3
;拟合Excel文件名后缀
output_suffix = _称重拟合
[MODULE_TEST]
;true: 仅启动环境模块采集；false: 正常启动全部模块
environment_module_only = false

