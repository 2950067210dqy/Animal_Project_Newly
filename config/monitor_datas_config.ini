;监测数据的配置文件
[STORAGE]
;存储数据 在当前项目下的data文件夹下
fold_path = ./data/
;存储数据 在./data/monitor_data/ 文件夹下
sub_fold_path = /monitor_data/
;存储线程的delay 单位秒
delay = 0
;发送请求报文
[SEND]
;发送请求报文delay 单位秒
delay = 2
;已经弃用！发送请求报文之后获得响应报文的等待时间 单位秒
;变更为获得响应报文之后的等待时间 单位秒
get_response_delay =0
;串口配置
[Serial]
;timeout 单位秒
timeout = 0.05
;定时导出xlsx配置
[EXPORT]
;定时导出xlsx间隔，单位分钟；小于等于0表示关闭定时导出
periodic_xlsx_interval_minutes = 30
[WEIGHT_POSTPROCESS]
;停止实验导出原始Excel后，是否额外生成称重拟合Excel
enabled = true
;稳定平台至少需要连续点数
stable_points = 3
;稳定平台内部允许的最大波动，单位g
stable_tolerance_g = 1.0
;合理小鼠体重范围，单位g
minimum_body_weight_g = 5.0
maximum_body_weight_g = 80.0
;拟合体重相对最近有效结果允许的偏差比例
outlier_ratio = 0.20
;异常判断使用的最近有效结果数量
reference_history = 3
;拟合结果保留小数位数
decimal_places = 3
;拟合Excel文件名后缀
output_suffix = _称重拟合
[MODULE_TEST]
;true: 仅启动环境模块采集；false: 正常启动全部模块
environment_module_only = false
