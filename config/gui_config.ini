[basic]
;程序名称
name=animal_box_app
[theme];样式
;默认样式值 light dark
default = light
[window];主程序窗口项
;程序窗口名
title= 动物箱数据监测上位机
[monitor_camera_pic];tab4中的图片读取
;每隔多少秒读取一次 单位 秒
delay=1
;读取几秒钟前的数据 单位秒 实际是读delay+data_delay前的数据
data_delay= 0
[mouse_cage];鼠笼
