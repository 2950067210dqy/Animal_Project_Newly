;此次UFC_UGC_ZOS测试的配置文件
;公共参数
[PARAM]
;标准大气压数值 单位千帕KPa
standard_atmospheric_pressure=101.325
;氧气补偿系数 已经弃用！！！
oxygen_compensation_coefficient=1.1524
[ZOS]
;预测因子的初始值
factor = 1.219030
;启动的预热时间 推荐20min 这里单位秒
start_time = 1200
start_time_delay =2
;启动的zos通道压力初始化的读取压力值的每秒
start_read_pressure_delay =1
;启动的zos通道压力初始化的读取压力值的总秒数 就是一共读取5次 start_read_pressure_all_time/start_read_pressure_delay
start_read_pressure_all_time = 5
;启动的zos通道压力初始化 的气压稳定的默认值 kPa
pressure_steady_default = 85.0
;启动的zos通道压力初始化 的气压稳定的阈值 kPa  pressure_steady_default ± pressure_steady_threshold
pressure_steady_threshold = 0.1
;运行后的循环时间 的间隔 单位 秒
run_time_delay =2
;运行后的循环时间 单位 秒 默认15 ！！！
run_time = 15
#阈值 如果在非调零状态下，氧浓度异常，小于某一个阈值（如1%），检查传感器状态, 单位：%    ！！！已经弃用
threshold =1
[UFC]
;UFC 启动以及关闭气泵和流量控制器开启后等待的时间 单位秒 60 ！！！
wait_time = 60
;启动后需要等待1分钟 等待流量控制器自动配置及运行  这里单位秒
start_wait_time = 1
wait_time_delay = 1
;运行后的循环时间 单位 秒 默认15 ！！！
run_time = 15
run_time_delay =2
[UGC]
;运行后的循环时间 的间隔 单位 秒
run_time_delay =2

;标定
[Calibration]
#零点标定 二氧化碳稳定阈值
zero_calibration_carbon_threshold =0.1
#零点标定 氧气稳定阈值
zero_calibration_oxygen_threshold =0.1
#SPan量程标定 氧气稳定阈值
span_calibration_oxygen_threshold =0.1
#SPan量程标定  二氧化碳稳定阈值
span_calibration_carbon_threshold =0.1
#零点标定 每隔几秒一次 单位秒 ！！！已经弃用
start_time_delay = 300
#零点标定 循环采样至少多少秒
zero_calibration_circular_times = 60
#span标定 循环采样至少多少秒
span_calibration_circular_times = 60
;状态检测
[Gas_State_Check]
#状态检测 每隔几秒一次 单位秒
start_time_delay = 60
;发送请求报文
[SEND]
;发送请求报文delay 单位秒
delay = 0
;发送请求报文之后获得响应报文的等待时间 单位秒
get_response_delay = 0
;串口配置
[Serial]
;timeout 单位秒
timeout = 0.05